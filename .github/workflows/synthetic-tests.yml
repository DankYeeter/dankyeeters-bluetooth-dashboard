# Synthetic test run without a phone: the JVM/Robolectric suite plus both
# APKs. The Android 17 emulator probes live in android17-probes.yml and run
# only on demand.
name: synthetic-tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: synthetic-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.3.13750724"
  CMAKE_VERSION: "3.22.1"

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
      - name: Unit and Robolectric suite
        run: ./gradlew --continue test
      - name: Count tests
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for c in r.iter("testcase"):
                  for bad in list(c.iter("failure")) + list(c.iter("error")):
                      print(f"FAILED {c.get('classname')}.{c.get('name')}")
                      print("\n".join((bad.text or bad.get("message") or "").splitlines()[:40]))
          print(f"tests={t} failures={f} errors={e} skipped={s}")
          EOF
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/build/test-results/**/*.xml"
