# Synthetic test run without a phone.
#
# Job "suite": the JVM/Robolectric suite plus both APKs.
# Job "android17": boots an Android 17 (API 37) emulator and runs the
# device-side probes in ci/emulator-probe.sh against the debug build.
#
# What this cannot show: anything about the radio link (LDAC airtime, BQR
# events, dropouts at 990 kbps). The emulator has no LDAC sink.
name: synthetic-tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: synthetic-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.3.13750724"
  CMAKE_VERSION: "3.22.1"

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
      - name: Unit and Robolectric suite
        run: ./gradlew --continue test
      - name: Count tests
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for c in r.iter("testcase"):
                  for bad in list(c.iter("failure")) + list(c.iter("error")):
                      print(f"FAILED {c.get('classname')}.{c.get('name')}")
                      print("\n".join((bad.text or bad.get("message") or "").splitlines()[:40]))
          print(f"tests={t} failures={f} errors={e} skipped={s}")
          EOF
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/build/test-results/**/*.xml"
      - name: Room schema (to commit)
        run: cat core-monitor/schemas/*/4.json
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core-monitor/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  android17:
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator image (API 37)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -oE 'system-images;android-3[6-9][^ ]*;google_apis;x86_64' | sort -u | tee images.txt
          IMG=$(grep -E 'android-37' images.txt | sort -V | tail -1)
          test -n "$IMG" || { echo "no API 37 image listed"; exit 1; }
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          "$SDKM" emulator platform-tools "$IMG" > /dev/null
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n a17 -k "$IMG" --force
      - name: Boot
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd a17 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -camera-back none > emulator.log 2>&1 &
          EMU=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          booted=0
          for i in $(seq 1 300); do
            kill -0 $EMU 2>/dev/null || { echo "emulator exited"; break; }
            [ "$(timeout 5 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { booted=1; break; }
            sleep 2
          done
          if [ $booted != 1 ]; then tail -80 emulator.log; exit 1; fi
          "$ADB" shell getprop ro.build.version.release
          "$ADB" shell getprop ro.build.version.sdk
      - name: Emulator log
        if: failure()
        run: tail -200 emulator.log || true
      - name: Probes
        run: bash ci/emulator-probe.sh apks/debug/app-debug.apk apks/androidTest/debug/app-debug-androidTest.apk probe-out
      - name: Summary
        if: always()
        run: cat probe-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android17-probe
          path: |
            probe-out/
            emulator.log
